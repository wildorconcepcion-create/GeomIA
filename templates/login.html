{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white text-center">

                <h3>GeomIA</h3>
                <p class="mb-0">
                    Sistema de Gestión de Eventos Anómalos
                </p>

            </div>

            <div class="card-body">

                <h4 class="text-center mb-4">
                    Iniciar Sesión
                </h4>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Correo Electrónico
                        </label>

                        <input
                            type="email"
                            name="correo"
                            class="form-control"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Ingrese su contraseña"
                            required
                        >

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success">

                            Ingresar

                        </button>

                    </div>

                </form>

                <hr>

                <div class="text-center">

                    ¿No tienes una cuenta?

                    <br>

                    <a href="/register"
                       class="btn btn-outline-primary mt-2">

                        Registrarse

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
