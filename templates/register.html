{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-success text-white text-center">
                <h3>Registro de Usuario</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Nombre Completo
                        </label>

                        <input
                            type="text"
                            name="nombre"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Correo Electrónico
                        </label>

                        <input
                            type="email"
                            name="correo"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success">

                            Registrarse

                        </button>

                    </div>

                </form>

                <hr>

                <div class="text-center">

                    ¿Ya tienes una cuenta?

                    <br>

                    <a href="/login"
                       class="btn btn-outline-primary mt-2">

                        Iniciar Sesión

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
