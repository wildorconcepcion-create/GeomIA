{% extends "base.html" %}

{% block content %}

<h2>Administración de Usuarios</h2>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

    {% for usuario in usuarios %}

        <tr>
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.correo }}</td>
            <td>{{ usuario.rol }}</td>
            <td>

                <a href="/usuario/rol/{{ usuario.id }}"
                   class="btn btn-warning btn-sm">
                    Cambiar Rol
                </a>

            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>

<a href="/dashboard" class="btn btn-secondary">
    Volver
</a>

{% endblock %}
