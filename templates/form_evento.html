{% extends "base.html" %}

{% block content %}

<h2>{{ titulo }}</h2>

<form method="POST">

    <div class="mb-3">
        <label>Nombre del Evento</label>
        <input type="text"
               name="nombre_evento"
               class="form-control"
               value="{{ evento.nombre_evento if evento else '' }}"
               required>
    </div>

    <div class="mb-3">
        <label>Tipo</label>
        <input type="text"
               name="tipo_evento"
               class="form-control"
               value="{{ evento.tipo_evento if evento else '' }}"
               required>
    </div>

    <div class="mb-3">
        <label>Fecha</label>
        <input type="date"
               name="fecha"
               class="form-control"
               value="{{ evento.fecha if evento else '' }}">
    </div>

    <div class="mb-3">
        <label>Ubicación</label>
        <input type="text"
               name="ubicacion"
               class="form-control"
               value="{{ evento.ubicacion if evento else '' }}">
    </div>

    <div class="mb-3">
        <label>Descripción</label>
        <textarea name="descripcion"
                  class="form-control">{{ evento.descripcion if evento else '' }}</textarea>
    </div>

    <div class="mb-3">
        <label>Nivel de Riesgo</label>
        <select name="nivel_riesgo"
                class="form-control">

            <option>BAJO</option>
            <option>MEDIO</option>
            <option>ALTO</option>

        </select>
    </div>

    <button class="btn btn-primary">
        Guardar
    </button>

</form>

{% endblock %}
